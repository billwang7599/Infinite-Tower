<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Tower</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1a; }
      #game { width: 100%; height: 100%; display: block; outline: none; }
      #hud {
        position: fixed; top: 12px; left: 16px; color: #fff; pointer-events: none;
        font: 600 18px/1.4 system-ui, sans-serif; text-shadow: 0 2px 4px #000a;
      }
      #hud small { font-weight: 400; opacity: 0.7; font-size: 13px; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
