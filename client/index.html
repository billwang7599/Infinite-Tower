<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite Tower</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d1a; }
      #game { width: 100%; height: 100%; display: block; outline: none; }
      #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; font: 600 16px/1.4 system-ui, sans-serif; text-shadow: 0 2px 4px #000a; }
      #hud small { font-weight: 400; opacity: 0.75; font-size: 13px; }
      #info { position: absolute; top: 12px; left: 16px; }
      .bar { position: relative; height: 10px; background: #0009; border: 1px solid #fff3; margin-bottom: 6px; }
      .bar > div { position: absolute; inset: 0 auto 0 0; }
      .bar .lag { background: #e8d8a0; transition: none; }
      #bars { position: absolute; top: 40px; left: 16px; width: 300px; }
      .hp .fill { background: linear-gradient(#d8463c, #8f1f1a); }
      .st { width: 70%; }
      .st .fill { background: linear-gradient(#5fc26a, #2a7a36); }
      #boss { position: absolute; bottom: 48px; left: 50%; width: min(640px, 70vw); transform: translateX(-50%); transition: opacity 0.6s; }
      #boss .name { font: 500 17px Georgia, serif; letter-spacing: 1px; margin-bottom: 4px; }
      .boss .fill { background: linear-gradient(#b8322a, #6e1612); }
      #banner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        opacity: 0; transition: opacity 1.2s; background: linear-gradient(transparent 38%, #000b 45%, #000b 58%, transparent 65%); }
      #banner.show { opacity: 1; }
      #banner .title { font: 400 64px Georgia, serif; letter-spacing: 6px; }
      #banner.lost .title { color: #a8231b; }
      #banner.won .title { color: #e8c45a; }
      #banner .sub { font-weight: 400; opacity: 0.8; margin-top: 8px; }
      #hud[data-mode="map"] { display: none; }
      #maphud { position: fixed; top: 12px; left: 16px; color: #fff; pointer-events: none;
        font: 600 16px/1.4 system-ui, sans-serif; text-shadow: 0 2px 4px #000a; }
      #maphud small { font-weight: 400; opacity: 0.8; font-size: 13px; }
      #fade { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: #000; }
      #toast { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); pointer-events: none;
        font: 400 30px Georgia, serif; letter-spacing: 2px; color: #fff; text-shadow: 0 2px 8px #000;
        opacity: 0; transition: opacity 0.5s; white-space: nowrap; }
      #toast.show { opacity: 1; }
      #capture { position: absolute; top: 12px; right: 16px; font-weight: 400; font-size: 13px; transition: opacity 0.3s; }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <div id="maphud"></div>
    <div id="toast"></div>
    <div id="fade"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
